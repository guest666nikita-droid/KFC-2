<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KFC Combat 2</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
        body { background-color: #111; overflow: hidden; font-family: 'Arial Black', sans-serif; touch-action: none; }
        
        #game-container { position: relative; width: 100vw; height: 100vh; background-color: #808080; }
        canvas { display: block; width: 100%; height: 100%; object-fit: cover; }

        /* Начальный экран для запуска интро */
        #start-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; display: flex; align-items: center; justify-content: center;
            z-index: 300; cursor: pointer; text-align: center;
        }

        /* Интро видео */
        #intro-video {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            object-fit: cover; z-index: 200; display: none; background: #000; cursor: pointer;
        }

        /* Меню, Пауза, Выбор режима и Экран Победы */
        #menu, #pause-menu, #mode-menu, #victory-menu {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 15, 15, 0.95); display: flex; flex-direction: column;
            align-items: center; justify-content: center; z-index: 100;
        }
        #menu, #pause-menu, #mode-menu, #victory-menu { display: none; }
        #victory-menu { z-index: 150; } /* Экран победы поверх всего */
        
        /* Стили для логотипа-картинки */
        .logo-img {
            width: 85%;
            max-width: 420px;
            height: auto;
            margin-bottom: 2rem;
            filter: drop-shadow(0 4px 15px rgba(0, 0, 0, 0.9));
        }

        h1 { 
            color: #fff; font-size: 3rem; margin-bottom: 1.5rem; 
            text-shadow: 4px 4px 0 #e60000; text-align: center;
            letter-spacing: 2px;
        }

        .blink-text {
            animation: blinker 1.5s linear infinite;
        }
        @keyframes blinker {
            50% { opacity: 0; }
        }
        
        button {
            padding: 16px 45px; font-size: 1.4rem; font-weight: bold;
            background: #e60000; color: white; border: 3px solid #fff;
            border-radius: 12px; cursor: pointer; margin: 10px; 
            box-shadow: 0 6px 0 #990000; text-transform: uppercase;
        }
        button:active { transform: translateY(4px); box-shadow: 0 2px 0 #990000; }
        
        .btn-secondary {
            background: #555; box-shadow: 0 6px 0 #333; margin-top: 30px;
        }
        .btn-secondary:active { box-shadow: 0 2px 0 #333; }

        /* ОТОБРАЖЕНИЕ ВАЛЮТЫ (КРЫЛКОЙНЫ) */
        .coin-display {
            position: absolute; top: 20px; right: 20px;
            display: flex; align-items: center;
            background: rgba(0, 0, 0, 0.8); padding: 8px 15px;
            border-radius: 30px; border: 2px solid #ffcc00;
            color: #fff; font-size: 1.5rem; font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,0,0,0.8);
            z-index: 110;
        }
        .coin-icon { width: 35px; height: 35px; margin-right: 10px; }
        
        /* Награда на экране победы */
        #victory-reward {
            display: flex; flex-direction: column; align-items: center;
            margin-bottom: 30px;
        }
        .coin-icon-large {
            width: 100px; height: 100px; margin-bottom: 5px;
            filter: drop-shadow(0 0 20px rgba(255, 204, 0, 0.6));
        }
        #victory-reward h2 {
            color: #ffcc00; font-size: 3rem; text-shadow: 3px 3px 0 #000;
        }

        /* Интерфейс HP и Пауза */
        #ui {
            position: absolute; top: 15px; left: 0; width: 100%; padding: 0 20px;
            display: none; justify-content: space-between; align-items: center; z-index: 10;
        }
        .hp-box { width: 38%; display: flex; flex-direction: column; }
        .hp-container { 
            width: 100%; background: #222; border: 3px solid #fff; 
            height: 26px; border-radius: 6px; position: relative; overflow: hidden;
            box-shadow: 0 0 10px rgba(0,0,0,0.8);
        }
        .hp-bar { height: 100%; background: #00ff44; width: 100%; transition: width 0.15s ease-out; }
        .hp-name { color: white; font-weight: 900; font-size: 15px; text-shadow: 2px 2px 0 #000; margin-bottom: 4px; }
        
        #pause-btn {
            background: #ffcc00; color: #000; border: 2px solid #fff; padding: 6px 18px;
            font-size: 1.2rem; font-weight: 900; border-radius: 8px; cursor: pointer;
            box-shadow: 0 4px 0 #b38f00; margin: 0;
        }

        /* Органы управления на экране */
        #controls {
            position: absolute; bottom: 0; left: 0; width: 100%; height: 45%;
            display: none; z-index: 10;
        }
        #joystick-area { position: absolute; left: 0; bottom: 0; width: 50%; height: 100%; }
        #joystick-base {
            position: absolute; bottom: 25px; left: 25px; width: 110px; height: 110px;
            background: rgba(255,255,255,0.3); border-radius: 50%; border: 2px solid rgba(255,255,255,0.6);
            display: flex; justify-content: center; align-items: center;
        }
        #joystick-stick {
            width: 45px; height: 45px; background: rgba(255,255,255,0.9); border-radius: 50%;
            transform: translate(0px, 0px); box-shadow: 0 0 10px rgba(0,0,0,0.5);
        }
        #attack-btn {
            position: absolute; bottom: 30px; right: 30px; width: 90px; height: 90px;
            background: rgba(230, 0, 0, 0.7); border-radius: 50%; border: 3px solid rgba(255,255,255,0.8);
            color: white; font-size: 2.2rem; font-weight: 900; display: flex;
            justify-content: center; align-items: center; box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        #attack-btn:active { background: rgba(255, 60, 60, 0.9); transform: scale(0.95); }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas"></canvas>

    <!-- Начальный экран для клика -->
    <div id="start-screen">
        <h1 class="blink-text">НАЖМИТЕ<br>ДЛЯ ЗАПУСКА</h1>
    </div>

    <!-- Интро видео -->
    <video id="intro-video" src="intro.mp4" playsinline></video>

    <!-- Главное Меню -->
    <div id="menu">
        <div class="coin-display">
            <img src="1000369791_2906d6.png" class="coin-icon">
            <span id="menu-coin-count">0</span>
        </div>
        <img src="1000369766.png" alt="KFC КОМБАТ 2" class="logo-img">
        <button id="play-btn">ИГРАТЬ</button>
    </div>

    <!-- Меню выбора режима -->
    <div id="mode-menu">
        <img src="1000369766.png" alt="KFC КОМБАТ 2" class="logo-img">
        <button id="normal-btn">ОБЫЧНЫЙ</button>
        <button id="training-btn">ТРЕНИРОВКА</button>
        <button id="back-btn" class="btn-secondary">НАЗАД</button>
    </div>

    <!-- Пауза -->
    <div id="pause-menu">
        <div class="coin-display">
            <img src="1000369791_2906d6.png" class="coin-icon">
            <span id="pause-coin-count">0</span>
        </div>
        <h1>ПАУЗА</h1>
        <button id="resume-btn">ПРОДОЛЖИТЬ</button>
        <button id="exit-btn">ВЫЙТИ</button>
    </div>

    <!-- Экран Победы / Поражения -->
    <div id="victory-menu">
        <h1 id="victory-title">ТЫ ПОБЕДИЛ!</h1>
        <div id="victory-reward">
            <img src="1000369791_2906d6.png" class="coin-icon-large">
            <h2>+10</h2>
        </div>
        <button id="victory-to-menu-btn">В МЕНЮ</button>
    </div>

    <!-- Интерфейс HP -->
    <div id="ui">
        <div class="hp-box">
            <div id="player-name" class="hp-name">ТОХА</div>
            <div class="hp-container"><div id="player-hp" class="hp-bar"></div></div>
        </div>
        <button id="pause-btn">||</button>
        <div class="hp-box" id="bot-ui" style="align-items: flex-end;">
            <div id="bot-name" class="hp-name">ТОХА (БОТ)</div>
            <div class="hp-container"><div id="bot-hp" class="hp-bar" style="background: #ff2222;"></div></div>
        </div>
    </div>

    <!-- Джойстик и Кнопка Удара W -->
    <div id="controls">
        <div id="joystick-area">
            <div id="joystick-base"><div id="joystick-stick"></div></div>
        </div>
        <div id="attack-btn">W</div>
    </div>
</div>

<script>
    // --- Система Валюты (Крылкойны) ---
    // Достаем монеты из сохранения браузера. Если их нет, то 0.
    let wingsCoins = localStorage.getItem('wingsCoins') ? parseInt(localStorage.getItem('wingsCoins')) : 0;

    function updateCoinDisplays() {
        document.getElementById('menu-coin-count').innerText = wingsCoins;
        document.getElementById('pause-coin-count').innerText = wingsCoins;
        localStorage.setItem('wingsCoins', wingsCoins); // Сохраняем в память
    }
    updateCoinDisplays(); // Обновляем при запуске


    // --- Логика Интро ---
    const startScreen = document.getElementById('start-screen');
    const introVideo = document.getElementById('intro-video');
    const menu = document.getElementById('menu');

    startScreen.addEventListener('click', () => {
        startScreen.style.display = 'none';
        introVideo.style.display = 'block';
        
        introVideo.play().catch(e => {
            introVideo.style.display = 'none';
            menu.style.display = 'flex';
        });
    });

    introVideo.addEventListener('ended', () => {
        introVideo.style.display = 'none';
        menu.style.display = 'flex';
    });

    introVideo.addEventListener('click', () => {
        introVideo.pause();
        introVideo.style.display = 'none';
        menu.style.display = 'flex';
    });


    // --- Основная логика игры ---
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    
    const offCanvas = document.createElement('canvas');
    const offCtx = offCanvas.getContext('2d', { willReadFrequently: true });
    const OFF_SIZE = 200; 
    offCanvas.width = OFF_SIZE;
    offCanvas.height = OFF_SIZE;

    let isPlaying = false;
    let isPaused = false;
    let gameMode = 'normal'; 
    let gameLoop;

    // Настройки баланса и скорости
    const MAX_HP = 100;    // Теперь 100 ХП
    const DAMAGE = 6;      // Урон 6 ХП за удар
    const ATTACK_COOLDOWN = 2800; 
    const SPEED = 3.75; 
    
    const videos = {
        idle: createVideo('idle.mp4'),          
        attack: createVideo('1000369752.mp4'),  
        walk: createVideo('1000369753.mp4'),    
        hit: createVideo('1000369757.mp4')      
    };

    function createVideo(src) {
        const v = document.createElement('video');
        v.src = src;
        v.loop = true;
        v.muted = true;
        v.playsInline = true;
        return v;
    }

    function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function getProcessedFrame(video) {
        if (video.readyState < 2) return null;
        offCtx.clearRect(0, 0, OFF_SIZE, OFF_SIZE);
        
        const minDim = Math.min(video.videoWidth, video.videoHeight);
        const sx = (video.videoWidth - minDim) / 2;
        const sy = (video.videoHeight - minDim) / 2;

        offCtx.drawImage(video, sx, sy, minDim, minDim, 0, 0, OFF_SIZE, OFF_SIZE);
        
        const imgData = offCtx.getImageData(0, 0, OFF_SIZE, OFF_SIZE);
        const data = imgData.data;
        for (let i = 0; i < data.length; i += 4) {
            if (data[i] > 200 && data[i+1] > 200 && data[i+2] > 200) {
                data[i+3] = 0; 
            }
        }
        offCtx.putImageData(imgData, 0, 0);
        return offCanvas;
    }

    class Fighter {
        constructor(x, isBot) {
            this.x = x;
            this.width = 90;
            this.height = 120;
            this.y = 0; 
            this.hp = MAX_HP;
            this.isBot = isBot;
            this.dir = isBot ? -1 : 1; 
            this.state = 'idle';
            this.stateTime = 0;
            this.lastAttackTime = 0;
            this.moving = 0;
            this.hasDealtDamage = false;
        }

        update(deltaTime, enemy) {
            const floorHeight = 80;
            this.y = canvas.height - floorHeight - this.height;

            if (this.state === 'hit') {
                this.stateTime -= deltaTime;
                if (this.stateTime <= 0) this.state = 'idle';
                return;
            }

            if (this.state === 'attack') {
                this.stateTime -= deltaTime;
                
                if (this.stateTime > 1200 && this.stateTime < 1500 && !this.hasDealtDamage) {
                    if (enemy) this.checkHit(enemy);
                    this.hasDealtDamage = true;
                }

                if (this.stateTime <= 0) {
                    this.state = 'idle';
                }
                return;
            }

            if (this.moving !== 0) {
                this.state = 'walk';
                this.x += this.moving * SPEED;
                this.dir = this.moving; 
            } else {
                this.state = 'idle';
            }

            if (this.x < 30) this.x = 30;
            if (this.x > canvas.width - 30) this.x = canvas.width - 30;

            if (this.isBot && enemy) {
                const dist = Math.abs(enemy.x - this.x);
                if (dist > 50) {
                    this.moving = enemy.x > this.x ? 1 : -1;
                } else {
                    this.moving = 0;
                    this.dir = enemy.x > this.x ? 1 : -1;
                    this.tryAttack();
                }
            }
        }

        tryAttack() {
            const now = Date.now();
            if (now - this.lastAttackTime >= ATTACK_COOLDOWN && this.state !== 'hit' && this.state !== 'attack') {
                this.state = 'attack';
                this.stateTime = 2600; 
                this.lastAttackTime = now;
                this.hasDealtDamage = false;
                videos.attack.currentTime = 0;
                videos.attack.play().catch(e => console.log(e));
            }
        }

        checkHit(enemy) {
            const dist = Math.abs(enemy.x - this.x);
            const facingEnemy = (this.dir === 1 && enemy.x > this.x) || (this.dir === -1 && enemy.x < this.x);
            
            if (dist < 80 && facingEnemy) {
                enemy.takeDamage(DAMAGE);
            }
        }

        takeDamage(amount) {
            this.hp -= amount;
            if (this.hp < 0) this.hp = 0;
            this.state = 'hit';
            this.stateTime = 400;
            videos.hit.currentTime = 0;
            videos.hit.play().catch(e => console.log(e));
            updateHP();
        }

        draw() {
            ctx.save();
            ctx.translate(this.x, this.y + (this.height / 2));
            ctx.scale(this.dir, 1);

            let vid = videos.idle; 
            if (this.state === 'walk') vid = videos.walk;
            else if (this.state === 'attack') vid = videos.attack;
            else if (this.state === 'hit') vid = videos.hit;

            const processedFrame = getProcessedFrame(vid);

            if (processedFrame) {
                ctx.drawImage(processedFrame, -this.width / 2, -this.height / 2, this.width, this.height);
            }
            
            ctx.restore();
        }
    }

    let player, bot;
    let lastTime = 0;

    function initGame() {
        player = new Fighter(canvas.width * 0.15, false);
        
        if (gameMode === 'normal') {
            bot = new Fighter(canvas.width * 0.85, true);
            document.getElementById('bot-ui').style.display = 'flex';
        } else {
            bot = null; 
            document.getElementById('bot-ui').style.display = 'none';
        }
        
        updateHP();
    }

    function updateHP() {
        document.getElementById('player-hp').style.width = (player.hp / MAX_HP * 100) + '%';
        if (bot) {
            document.getElementById('bot-hp').style.width = (bot.hp / MAX_HP * 100) + '%';
        }
    }

    function drawArena() {
        ctx.fillStyle = '#808080';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        const floorHeight = 80;
        ctx.fillStyle = '#000000';
        ctx.fillRect(0, canvas.height - floorHeight, canvas.width, floorHeight);
    }

    function showVictoryMenu() {
        document.getElementById('ui').style.display = 'none';
        document.getElementById('controls').style.display = 'none';
        
        const victoryMenu = document.getElementById('victory-menu');
        const victoryTitle = document.getElementById('victory-title');
        const victoryReward = document.getElementById('victory-reward');
        
        if (player.hp <= 0) {
            // Игрок проиграл
            victoryTitle.innerText = "БОТ ПОБЕДИЛ!";
            victoryTitle.style.color = "#ff2222";
            victoryTitle.style.textShadow = "4px 4px 0 #550000";
            victoryReward.style.display = "none"; // Прячем награду
        } else {
            // Игрок выиграл
            victoryTitle.innerText = "ТЫ ПОБЕДИЛ!";
            victoryTitle.style.color = "#00ff44";
            victoryTitle.style.textShadow = "4px 4px 0 #005511";
            
            if (gameMode === 'normal') {
                victoryReward.style.display = "flex"; // Показываем награду
                wingsCoins += 10;
                updateCoinDisplays();
            } else {
                victoryReward.style.display = "none"; // В тренировке нет монет
            }
        }
        
        victoryMenu.style.display = 'flex';
    }

    function loop(timestamp) {
        if (!isPlaying) return;
        if (!isPaused) {
            const deltaTime = timestamp - lastTime;
            lastTime = timestamp;

            drawArena();

            player.update(deltaTime, bot);
            player.draw();

            if (bot) {
                bot.update(deltaTime, player);
                bot.draw();
            }

            if (player.hp <= 0 || (bot && bot.hp <= 0)) {
                isPlaying = false;
                // Даем полсекунды доиграть анимацию смерти перед меню
                setTimeout(showVictoryMenu, 600);
            }
        } else {
            lastTime = timestamp;
        }
        gameLoop = requestAnimationFrame(loop);
    }

    // --- Управление Меню ---

    document.getElementById('play-btn').addEventListener('click', () => {
        document.getElementById('menu').style.display = 'none';
        document.getElementById('mode-menu').style.display = 'flex';
    });

    document.getElementById('back-btn').addEventListener('click', () => {
        document.getElementById('mode-menu').style.display = 'none';
        document.getElementById('menu').style.display = 'flex';
    });

    document.getElementById('normal-btn').addEventListener('click', () => startGame('normal'));
    document.getElementById('training-btn').addEventListener('click', () => startGame('training'));

    document.getElementById('victory-to-menu-btn').addEventListener('click', () => {
        document.getElementById('victory-menu').style.display = 'none';
        document.getElementById('menu').style.display = 'flex';
    });

    function startGame(mode) {
        Object.values(videos).forEach(v => { v.play().catch(e => console.log(e)); });
        gameMode = mode;
        
        document.getElementById('mode-menu').style.display = 'none';
        document.getElementById('ui').style.display = 'flex';
        document.getElementById('controls').style.display = 'block';
        
        initGame();
        isPlaying = true;
        isPaused = false;
        lastTime = performance.now();
        loop(performance.now());
    }

    // --- Пауза и Выход ---
    
    document.getElementById('pause-btn').addEventListener('click', () => {
        isPaused = true;
        document.getElementById('pause-menu').style.display = 'flex';
    });

    document.getElementById('resume-btn').addEventListener('click', () => {
        isPaused = false;
        document.getElementById('pause-menu').style.display = 'none';
    });

    document.getElementById('exit-btn').addEventListener('click', () => {
        isPaused = false;
        isPlaying = false;
        document.getElementById('pause-menu').style.display = 'none';
        document.getElementById('ui').style.display = 'none';
        document.getElementById('controls').style.display = 'none';
        document.getElementById('menu').style.display = 'flex'; 
    });

    // --- Джойстик и сенсоры ---

    const joyArea = document.getElementById('joystick-area');
    const joyStick = document.getElementById('joystick-stick');
    const attackBtn = document.getElementById('attack-btn');
    let touchId = null;

    joyArea.addEventListener('touchstart', (e) => {
        e.preventDefault();
        const touch = e.changedTouches[0];
        touchId = touch.identifier;
        handleJoystick(touch);
    }, {passive: false});

    joyArea.addEventListener('touchmove', (e) => {
        e.preventDefault();
        for (let i = 0; i < e.changedTouches.length; i++) {
            if (e.changedTouches[i].identifier === touchId) {
                handleJoystick(e.changedTouches[i]);
            }
        }
    }, {passive: false});

    const resetJoystick = () => {
        touchId = null;
        joyStick.style.transform = `translate(0px, 0px)`;
        if(player) player.moving = 0;
    };

    joyArea.addEventListener('touchend', resetJoystick);
    joyArea.addEventListener('touchcancel', resetJoystick);

    function handleJoystick(touch) {
        const rect = document.getElementById('joystick-base').getBoundingClientRect();
        const centerX = rect.left + rect.width / 2;
        let deltaX = touch.clientX - centerX;
        
        if (deltaX > 35) deltaX = 35;
        if (deltaX < -35) deltaX = -35;
        
        joyStick.style.transform = `translate(${deltaX}px, 0px)`;
        
        if (deltaX > 8) player.moving = 1;
        else if (deltaX < -8) player.moving = -1;
        else player.moving = 0;
    }

    attackBtn.addEventListener('touchstart', (e) => {
        e.preventDefault();
        if(player) player.tryAttack();
    }, {passive: false});
    
    // Клавиатура (ПК)
    window.addEventListener('keydown', (e) => {
        if (!player || isPaused) return;
        if (['a', 'A', 'Ф', 'ф'].includes(e.key)) player.moving = -1;
        if (['d', 'D', 'В', 'в'].includes(e.key)) player.moving = 1;
        if (['w', 'W', 'Ц', 'ц'].includes(e.key)) player.tryAttack();
    });
    window.addEventListener('keyup', (e) => {
        if (!player) return;
        if (['a', 'A', 'd', 'D', 'Ф', 'ф', 'В', 'в'].includes(e.key)) player.moving = 0;
    });
</script>
</body>
</html>
